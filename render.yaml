databases:
  - name: menswear-db
    plan: free
    region: singapore
    databaseName: menswear
    user: menswear

services:
  # ---- Backend: Spring Boot API (Docker) ----
  - type: web
    name: menswear-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      # Fill in after the menswear-db database is created — see the "Postgres" step
      # in the deploy walkthrough for exactly what to paste here.
      - key: DB_URL
        sync: false
      - key: DB_USER
        fromDatabase:
          name: menswear-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: menswear-db
          property: password

      # Redis is required (server-side sessions). Create a Key Value instance in
      # the Render dashboard first, then paste its Host/Port/Password here from
      # its "Connect" tab.
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false

      - key: SESSION_TIMEOUT_MINUTES
        value: "30"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax

      # Fill in with https://<menswear-web's-actual-onrender-url> once the web
      # service exists (see walkthrough step "Wire the two services together").
      - key: CORS_ORIGINS
        sync: false

  # ---- Frontend: Next.js storefront (native Node runtime, no Docker needed) ----
  - type: web
    name: menswear-web
    runtime: node
    plan: free
    region: singapore
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      # https://<menswear-api's-actual-onrender-url> — server-side only, used by
      # the Next.js rewrite proxy so the browser only ever talks to this app's
      # own origin (avoids cross-site cookie/CORS issues entirely).
      - key: API_BASE_URL
        sync: false
