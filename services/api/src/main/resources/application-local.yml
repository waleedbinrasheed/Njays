spring:
  datasource:
    url: jdbc:h2:mem:menswear;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  # Redis still needs to be reachable even in this profile (e.g. `docker compose up -d redis`) —
  # there's no embedded/in-memory equivalent for Spring Session the way H2 stands in for Postgres.
