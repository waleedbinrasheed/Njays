spring:
  application:
    name: menswear-api
  # Render's free tier gives the app a short window to open its port before a
  # deploy is marked as timed out. This defers non-JPA beans, but Spring
  # Boot's Flyway/JPA auto-configuration deliberately exempts the
  # DataSource/EntityManagerFactory chain from laziness (Flyway must run
  # before Hibernate validates the schema) — so it doesn't move the needle
  # much here. Left on since it's free and harmless.
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menswear}
    username: ${DB_USER:menswear}
    password: ${DB_PASSWORD:menswear}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789-ok}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  # The refresh token's sliding expiry — this IS the configurable inactivity
  # logout period. It's extended by REFRESH_TOKEN_MINUTES every time the
  # frontend calls /auth/refresh; if that stops happening (the user goes
  # inactive) for longer than this window, the next refresh attempt fails
  # and they're signed out.
  refresh-token-minutes: ${SESSION_TIMEOUT_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health

menswear:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

logging:
  level:
    com.menswear: INFO
