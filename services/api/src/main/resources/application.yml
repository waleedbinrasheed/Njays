spring:
  application:
    name: menswear-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menswear}
    username: ${DB_USER:menswear}
    password: ${DB_PASSWORD:menswear}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  session:
    store-type: redis
    redis:
      namespace: menswear:session
    # This IS the configurable inactivity logout period — Spring Session's Redis
    # store implements sliding expiration natively: every authenticated request
    # touches the session and pushes its TTL back out by this amount.
    timeout: ${SESSION_TIMEOUT_MINUTES:30}m
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        name: MENSWEAR_SESSION
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: ${COOKIE_SAME_SITE:lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

menswear:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.menswear: INFO
