spring:
  application:
    name: menswear-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/menswear}
    username: ${DB_USER:menswear}
    password: ${DB_PASSWORD:menswear}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789-ok}
  access-token-minutes: ${ACCESS_TOKEN_MINUTES:15}
  # The refresh token's sliding expiry — this IS the configurable inactivity
  # logout period. It's extended by REFRESH_TOKEN_MINUTES every time the
  # frontend calls /auth/refresh; if that stops happening (the user goes
  # inactive) for longer than this window, the next refresh attempt fails
  # and they're signed out.
  refresh-token-minutes: ${SESSION_TIMEOUT_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

menswear:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.menswear: INFO
